name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Installer + portable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build llama.cpp (upstream, CPU-only)
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git llama-build
          cd llama-build
          cmake -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DGGML_CUDA=OFF -DGGML_VULKAN=OFF -DBUILD_SHARED_LIBS=ON
          cmake --build build --config Release --target llama ggml-base ggml
          # Ninja output layout: build/bin/ (not build/bin/Release/ like the VS generator)
          $dllDir = Get-ChildItem build -Recurse -Filter *.dll | Select-Object -First 1 | ForEach-Object { $_.DirectoryName }
          Write-Host "DLL directory: $dllDir"
          New-Item -ItemType Directory -Path ../native-dlls | Out-Null
          Copy-Item "$dllDir"/*.dll ../native-dlls/
          Write-Host "Built $(Get-ChildItem ../native-dlls/*.dll | Measure-Object).Count native DLLs"

      - name: Publish (self-contained, single file)
        shell: pwsh
        run: |
          dotnet publish src/Forge.App/Forge.App.csproj `
            -c Release -r win-x64 --self-contained `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=none `
            -o installer/publish

      - name: Bundle native runtime DLLs
        shell: pwsh
        run: |
          Copy-Item native-dlls/*.dll installer/publish/ -Force
          Write-Host "Native DLLs in publish output:"
          Get-ChildItem installer/publish/*.dll | ForEach-Object { Write-Host "  $($_.Name) $([math]::Round($_.Length/1MB,1)) MB" }

      - name: Build installer (Inno Setup 6)
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          (Get-Content installer\forge.isn -Raw) -replace '#define MyAppVersion ".*"', "#define MyAppVersion `"$version`"" | Set-Content installer\forge.isn
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            winget install --id JRSoftware.InnoSetup --accept-source-agreements --accept-package-agreements
            $iscc = "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
          }
          & $iscc "installer\forge.isn"

      - name: Build portable zip (exe + Assets + native DLLs + portable.txt)
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          New-Item -ItemType File -Path installer\publish\portable.txt -Force | Out-Null
          New-Item -ItemType Directory -Path dist | Out-Null
          # The .ico/.wav assets are ExcludeFromSingleFile, so they live on disk next to the
          # exe (AppContext.BaseDirectory) and LoadIcon reads them from there at startup.
          # Native DLLs (llama.dll, ggml*.dll) must also ship — LlamaNative loads them
          # from AppContext.BaseDirectory at model-load time.
          $items = @("installer\publish\Forge.App.exe", "installer\publish\Assets", "installer\publish\portable.txt")
          $items += (Get-ChildItem installer\publish\*.dll | ForEach-Object { $_.FullName })
          Compress-Archive -Path $items -DestinationPath "dist\Forge-Portable-$version-win-x64.zip"

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = $tag -replace '^v', ''
          $installer = (Get-ChildItem installer\Output\ForgeSetup-*.exe)[0].FullName
          gh release create "$tag" `
            --title "Forge $version" `
            --notes "## Artifacts`n`n- **ForgeSetup-$version.exe** — per-user installer (no admin required)`n- **Forge-Portable-$version-win-x64.zip** — portable: one self-contained exe + ``portable.txt``; settings and models live next to the exe" `
            "$installer" "dist\Forge-Portable-$version-win-x64.zip"
