name: llama-cpp-vulkan-build

on:
  workflow_dispatch:
  schedule:
    # Rebuild weekly in case the pinned commit's deps shift.
    - cron: "0 6 * * 1"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Download precompiled llama.cpp DLLs
        shell: pwsh
        run: |
          # Download the NuGet packages that ship precompiled DLLs directly
          # from nuget.org (avoids deprecated dotnet nuget install).
          New-Item -ItemType Directory -Force -Path nupkgs
          Invoke-WebRequest -Uri "https://api.nuget.org/v3-flatcontainer/llamasharp.backend.vulkan.windows/0.30.0/llamasharp.backend.vulkan.windows.0.30.0.nupkg" -OutFile "nupkgs\vulkan.nupkg"
          Invoke-WebRequest -Uri "https://api.nuget.org/v3-flatcontainer/llamasharp.backend.cpu.windows/0.30.0/llamasharp.backend.cpu.windows.0.30.0.nupkg" -OutFile "nupkgs\cpu.nupkg"
          # Extract them
          Expand-Archive -Path "nupkgs\vulkan.nupkg" -DestinationPath "packages\vulkan"
          Expand-Archive -Path "nupkgs\cpu.nupkg" -DestinationPath "packages\cpu"

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts
          # These DLLs are already built and tested — no custom build needed.
          $src = "packages\vulkan\runtimes\win-x64\native"
          Copy-Item "$src\ggml-vulkan.dll" artifacts/
          # CPU + base DLLs come from the main LLamaSharp package
          $cpuSrc = "packages\cpu\runtimes\win-x64\native"
          Copy-Item "$cpuSrc\ggml.dll" artifacts/
          Copy-Item "$cpuSrc\ggml-base.dll" artifacts/
          Copy-Item "$cpuSrc\ggml-cpu-*.dll" artifacts/
          Copy-Item "$cpuSrc\llama.dll" artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: llama-cpp-vulkan-win-x64
          path: artifacts/
          retention-days: 30
