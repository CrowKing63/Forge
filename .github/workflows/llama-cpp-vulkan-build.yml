name: llama-cpp-vulkan-build

on:
  workflow_dispatch:
  schedule:
    # Rebuild weekly in case the pinned commit's deps shift.
    - cron: "0 6 * * 1"

env:
  VULKAN_VERSION: 1.4.313.2
  LLAMA_CPP_REF: v0.9.0

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          curl.exe -o "$env:RUNNER_TEMP\VulkanSDK-Installer.exe" -L "https://sdk.lunarg.com/sdk/download/${env:VULKAN_VERSION}/windows/vulkansdk-windows-X64-${env:VULKAN_VERSION}.exe"
          & "$env:RUNNER_TEMP\VulkanSDK-Installer.exe" --accept-licenses --default-answer --confirm-command install
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=C:\VulkanSDK\${env:VULKAN_VERSION}"
          Add-Content $env:GITHUB_PATH "C:\VulkanSDK\${env:VULKAN_VERSION}\bin"

      - name: Clone llama.cpp
        shell: pwsh
        run: |
          git clone --depth 1 "https://github.com/ggml-org/llama.git" llama.cpp
          cd llama.cpp
          git fetch --depth 1 origin tag ${{ env.LLAMA_CPP_REF }}
          git checkout ${{ env.LLAMA_CPP_REF }}

      - name: Build llama.cpp (Vulkan + CPU)
        shell: pwsh
        run: |
          cmake -S llama.cpp -B build `
            -DCMAKE_BUILD_TYPE=Release `
            -DGGML_NATIVE=OFF `
            -DLLAMA_BUILD_SERVER=ON `
            -DGGML_VULKAN=ON `
            -DGGML_BACKEND_DL=ON `
            -DGGML_CPU_ALL_VARIANTS=ON
          cmake --build build --config Release -j ${env:NUMBER_OF_PROCESSORS}

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts
          $src = "build\bin\Release"
          Copy-Item "$src\llama.dll" artifacts/
          Copy-Item "$src\ggml.dll" artifacts/
          Copy-Item "$src\ggml-base.dll" artifacts/
          Copy-Item "$src\ggml-cpu-*.dll" artifacts/
          Copy-Item "$src\ggml-vulkan.dll" artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: llama-cpp-vulkan-win-x64
          path: artifacts/
          retention-days: 30
