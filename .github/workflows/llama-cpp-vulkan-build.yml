name: llama-cpp-vulkan-build

on:
  workflow_dispatch:
  schedule:
    # Rebuild weekly in case the pinned commit's deps shift.
    - cron: "0 6 * * 1"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout llama.cpp (pinned)
        uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: v0.9.0

      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          # Download Vulkan Headers (source archive — stable URL)
          $url = "https://github.com/KhronosGroup/Vulkan-Headers/archive/refs/tags/v1.4.309.zip"
          Invoke-WebRequest -Uri $url -OutFile vk_headers.zip
          Expand-Archive -Path vk_headers.zip -DestinationPath .

          # Download SPIRV-Headers (required by ggml-vulkan CMake)
          $spirvUrl = "https://github.com/KhronosGroup/SPIRV-Headers/archive/refs/tags/vulkan-sdk-1.4.309.0.zip"
          Invoke-WebRequest -Uri $spirvUrl -OutFile spirv_headers.zip
          Expand-Archive -Path spirv_headers.zip -DestinationPath .

          # Download glslc (GLSL→SPIR-V compiler, required by find_package)
          $glslcUrl = "https://github.com/KhronosGroup/glslc/releases/latest/download/glslc-windows-x86_64.zip"
          Invoke-WebRequest -Uri $glslcUrl -OutFile glslc.zip
          Expand-Archive -Path glslc.zip -DestinationPath glslc-bin

      - name: Configure CMake
        shell: pwsh
        run: |
          $includeDir = "$PWD/Vulkan-Headers-1.4.309/include"
          $loader = "C:\Windows\System32\vulkan-1.dll"
          $glslc = "$PWD/glslc-bin/glslc.exe"
          cmake -B build-vulkan -A x64 `
            -DGGML_VULKAN=ON `
            -DVulkan_INCLUDE_DIR="$includeDir" `
            -DVulkan_LIBRARY="$loader" `
            -Dglslc_EXECUTABLE="$glslc" `
            -DSPIRV-Headers_DIR="$PWD/SPIRV-Headers-vulkan-sdk-1.4.309.0" `
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: pwsh
        run: cmake --build build-vulkan --config Release --parallel

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts
          $src = "build-vulkan/bin/Release"
          Copy-Item "$src/llama.dll" artifacts/
          Copy-Item "$src/ggml.dll" artifacts/
          Copy-Item "$src/ggml-base.dll" artifacts/
          Copy-Item "$src/ggml-cpu-*.dll" artifacts/
          Copy-Item "$src/ggml-vulkan.dll" artifacts/
          # CUDA is optional; include it so the same artefact covers both backends.
          if (Test-Path "$src/ggml-cuda.dll") { Copy-Item "$src/ggml-cuda.dll" artifacts/ }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: llama-cpp-vulkan-win-x64
          path: artifacts/
          retention-days: 30
