name: llama-cpp-vulkan-build

on:
  workflow_dispatch:
  schedule:
    # Rebuild weekly in case the pinned commit's deps shift.
    - cron: "0 6 * * 1"

env:
  VULKAN_VERSION: 1.4.313.2
  LLAMA_CPP_REF: c4261a74a59c5a719e8f73038e28633b08f2bea4

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          curl.exe -o "$env:RUNNER_TEMP\VulkanSDK-Installer.exe" -L "https://sdk.lunarg.com/sdk/download/${env:VULKAN_VERSION}/windows/vulkansdk-windows-X64-${env:VULKAN_VERSION}.exe"
          & "$env:RUNNER_TEMP\VulkanSDK-Installer.exe" --accept-licenses --default-answer --confirm-command install
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=C:\VulkanSDK\${env:VULKAN_VERSION}"
          Add-Content $env:GITHUB_PATH "C:\VulkanSDK\${env:VULKAN_VERSION}\bin"

      - name: Download llama.cpp source
        shell: pwsh
        run: |
          $sha = "${env:LLAMA_CPP_REF}"
          curl.exe -L -o llama-src.tar.gz "https://codeload.github.com/ggml-org/llama.cpp/tar.gz/$sha"
          tar -xzf llama-src.tar.gz
          # Extracted folder is llama.cpp-<sha>
          $src = "llama.cpp-$sha"
          if (-not (Test-Path $src)) { Write-Error "Extracted dir not found: $src"; exit 1 }
          Move-Item $src llama.cpp

      - name: Build llama.cpp (Vulkan + CPU)
        shell: pwsh
        run: |
          cmake -S llama.cpp -B build `
            -DCMAKE_BUILD_TYPE=Release `
            -DGGML_NATIVE=OFF `
            -DLLAMA_BUILD_SERVER=ON `
            -DGGML_VULKAN=ON `
            -DGGML_BACKEND_DL=ON `
            -DGGML_CPU_ALL_VARIANTS=ON
          cmake --build build --config Release -j ${env:NUMBER_OF_PROCESSORS}

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts
          $src = "build\bin\Release"
          Copy-Item "$src\llama.dll" artifacts/
          Copy-Item "$src\ggml.dll" artifacts/
          Copy-Item "$src\ggml-base.dll" artifacts/
          Copy-Item "$src\ggml-cpu-*.dll" artifacts/
          Copy-Item "$src\ggml-vulkan.dll" artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: llama-cpp-vulkan-win-x64
          path: artifacts/
          retention-days: 30
