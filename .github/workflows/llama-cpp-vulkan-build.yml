name: llama-cpp-vulkan-build

on:
  workflow_dispatch:
  schedule:
    # Rebuild weekly in case the pinned commit's deps shift.
    - cron: "0 6 * * 1"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout llama.cpp (pinned)
        uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: v0.9.0

      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          # Download the Vulkan SDK tarball (no installer needed).
          $sdkUrl = "https://sdk.lunarg.com/sdk/download/latest/windows/vulkan_sdk.tar.xz"
          Invoke-WebRequest -Uri $sdkUrl -OutFile vulkan_sdk.tar.xz
          tar -xf vulkan_sdk.tar.xz
          # The extracted folder is named like "VulkanSDK-1.4.309.0"
          $sdkDir = Get-ChildItem -Directory | Where-Object { $_.Name -like "VulkanSDK-*" } | Select-Object -First 1
          Write-Host "SDK dir: $($sdkDir.FullName)"

      - name: Configure CMake
        shell: pwsh
        run: |
          $sdkDir = Get-ChildItem -Directory | Where-Object { $_.Name -like "VulkanSDK-*" } | Select-Object -First 1
          cmake -B build-vulkan -A x64 `
            -DGGML_VULKAN=ON `
            -DVulkan_INCLUDE_DIR="$($sdkDir.FullName)\include" `
            -DVulkan_LIBRARY="$($sdkDir.FullName)\Lib\vulkan-1.dll" `
            -Dglslc_EXECUTABLE="$($sdkDir.FullName)\Bin\glslc.exe" `
            -DSPIRV-Headers_DIR="$($sdkDir.FullName)\SPIRV-Headers" `
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: pwsh
        run: cmake --build build-vulkan --config Release --parallel

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts
          $src = "build-vulkan/bin/Release"
          Copy-Item "$src/llama.dll" artifacts/
          Copy-Item "$src/ggml.dll" artifacts/
          Copy-Item "$src/ggml-base.dll" artifacts/
          Copy-Item "$src/ggml-cpu-*.dll" artifacts/
          Copy-Item "$src/ggml-vulkan.dll" artifacts/
          # CUDA is optional; include it so the same artefact covers both backends.
          if (Test-Path "$src/ggml-cuda.dll") { Copy-Item "$src/ggml-cuda.dll" artifacts/ }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: llama-cpp-vulkan-win-x64
          path: artifacts/
          retention-days: 30
