name: llama-cpp-vulkan-build

on:
  workflow_dispatch:
  schedule:
    # Rebuild weekly in case the pinned commit's deps shift.
    - cron: "0 6 * * 1"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout llama.cpp (pinned)
        uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: v0.9.0

      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          # Download and install the full Vulkan SDK from LunarG (includes
          # headers, loader, glslc, SPIRV-Headers).
          $sdkUrl = "https://vulkan.lunarg.com/sdk/downloads/windows-1.4.309.0-installer.exe"
          Invoke-WebRequest -Uri $sdkUrl -OutFile vulkan_sdk_installer.exe
          # Silent install to C:\VulkanSDK
          .\vulkan_sdk_installer.exe /s /v1 /D=C:\VulkanSDK

      - name: Configure CMake
        shell: pwsh
        run: |
          $sdk = "C:\VulkanSDK\1.4.309.0"
          cmake -B build-vulkan -A x64 `
            -DGGML_VULKAN=ON `
            -DVulkan_INCLUDE_DIR="$sdk\include" `
            -DVulkan_LIBRARY="$sdk\Lib\vulkan-1.dll" `
            -Dglslc_EXECUTABLE="$sdk\Bin\glslc.exe" `
            -DSPIRV-Headers_DIR="$sdk\SPIRV-Headers" `
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: pwsh
        run: cmake --build build-vulkan --config Release --parallel

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts
          $src = "build-vulkan/bin/Release"
          Copy-Item "$src/llama.dll" artifacts/
          Copy-Item "$src/ggml.dll" artifacts/
          Copy-Item "$src/ggml-base.dll" artifacts/
          Copy-Item "$src/ggml-cpu-*.dll" artifacts/
          Copy-Item "$src/ggml-vulkan.dll" artifacts/
          # CUDA is optional; include it so the same artefact covers both backends.
          if (Test-Path "$src/ggml-cuda.dll") { Copy-Item "$src/ggml-cuda.dll" artifacts/ }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: llama-cpp-vulkan-win-x64
          path: artifacts/
          retention-days: 30
