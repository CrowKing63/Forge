name: llama-cpp-vulkan-build

on:
  workflow_dispatch:
  schedule:
    # Rebuild weekly in case the pinned commit's deps shift.
    - cron: "0 6 * * 1"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Download precompiled llama.cpp DLLs
        shell: pwsh
        run: |
          # The NuGet package ships precompiled DLLs built from the pinned
          # llama.cpp commit. We just need to collect them for the release.
          New-Item -ItemType Directory -Force -Path artifacts

          # From LLamaSharp.Backend.Vulkan.Windows (Vulkan backend)
          $vulkanPkg = "C:\Users\runneradmin\.nuget\packages\llamasharp.backend.vulkan.windows"
          if (-not (Test-Path $vulkanPkg)) {
            # Install via NuGet if not cached
            dotnet nuget install LLamaSharp.Backend.Vulkan.Windows --version 0.30.0 -Source https://api.nuget.org/v3/index.json
          }

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts
          # These DLLs are already built and tested — no custom build needed.
          $src = "C:\Users\runneradmin\.nuget\packages\llamasharp.backend.vulkan.windows\0.30.0\LLamaSharpRuntimes\win-x64\native"
          Copy-Item "$src\ggml-vulkan.dll" artifacts/
          # CPU + base DLLs come from the main LLamaSharp package
          $cpuSrc = "C:\Users\runneradmin\.nuget\packages\llamasharp.backend.cpu.windows\0.30.0\LLamaSharpRuntimes\win-x64\native"
          Copy-Item "$cpuSrc\ggml.dll" artifacts/
          Copy-Item "$cpuSrc\ggml-base.dll" artifacts/
          Copy-Item "$cpuSrc\ggml-cpu-*.dll" artifacts/
          Copy-Item "$cpuSrc\llama.dll" artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: llama-cpp-vulkan-win-x64
          path: artifacts/
          retention-days: 30
